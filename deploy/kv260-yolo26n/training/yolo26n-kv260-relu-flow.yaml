# YOLO26n-derived ReLU flow candidate for B4096; requires bridge export.
# Original reference remains models/reference_final/best.pt.
# At VAI export: convert every C3k2 cv1 channel slice into two parallel
# one-to-one convolutions with partitioned cv1/BN weights; emit the raw
# one-to-one Detect maps before decode/TopK and pack the 3 maps in DPU.
nc: 6
end2end: True
reg_max: 1
scale: n
activation: nn.ReLU()
scales:
  n: [0.50, 0.25, 1024]
backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  # Original C2PSA is replaced with a local CSP block (different architecture).
  - [-1, 2, C3k2, [1024, False]]
head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  # Original attention=True is removed; retained Bottleneck maps can migrate.
  - [-1, 1, C3k2, [1024, False, 0.5, False]]
  - [[16, 19, 22], 1, Detect, [nc]]
